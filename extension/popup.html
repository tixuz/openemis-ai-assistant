<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        h3 {
            margin: 0 0 10px 0;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        .info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h3>🤖 AI Assistant</h3>

    <div id="status" class="status">
        <span id="status-text">Checking status...</span>
    </div>

    <button id="login-btn">Open Login Page</button>
    <button id="clear-token-btn">Clear Session</button>

    <div class="info">
        <p><strong>How to use:</strong></p>
        <ul style="margin: 5px 0; padding-left: 20px;">
            <li>Click the 🤖 button on any page</li>
            <li>Type automation requests</li>
            <li>AI will execute commands</li>
        </ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
